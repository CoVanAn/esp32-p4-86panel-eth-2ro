[env:esp32-p4]
platform = espressif32
board = esp32-p4
; Khai báo dùng song song cả 2 framework để tận dụng idf_component.yml
framework = arduino, espidf
lib_deps =
	https://github.com/moononournation/Arduino_GFX.git
	bblanchon/ArduinoJson@^7.0.4


build_flags = 
    -I include
    -I lib
    -D LV_CONF_INCLUDE_SIMPLE
    -D ARDUINO_AS_COMPONENT
    -D BOARD_HAS_PSRAM
    ; Cờ này giúp bỏ qua các lỗi lặt vặt của LVGL với trình biên dịch mới
    -Wno-error
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
